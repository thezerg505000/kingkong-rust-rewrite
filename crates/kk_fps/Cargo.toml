[package]
name = "kk-fps"
version = "0.1.0"
edition = "2021"
description = "First-person Jack shooter test slice rebuilt from King Kong (2005) PC/PS2 data"

[features]
# Windows/desktop default: gamepad + audio backends. The Linux CI check builds
# with `--no-default-features` because the build box has no udev/alsa headers.
default = ["gamepad", "audio"]
gamepad = ["bevy/bevy_gilrs"]
# hardware ray tracing (Bevy Solari): needs a GPU with ray queries (RTX / RDNA2+), Vulkan or DX12
raytracing = ["bevy/bevy_solari"]
# NVIDIA DLSS (Super Resolution + Ray Reconstruction): needs the DLSS SDK (env DLSS_SDK), the Vulkan SDK and clang at
# build time and nvngx_dlss.dll next to the exe at run time; see docs/REMASTER.md
dlss = ["bevy/dlss"]
# OpenGL ES backend: only for the headless software-GL test runs (WGPU_BACKEND=gl on llvmpipe)
gles = ["dep:bevy_render", "bevy_render/gles"]
# Firewheel audio engine (bevy_seedling): the game's sounds, 3D/HRTF voices, reverb, occlusion
audio = ["audio_engine", "bevy_seedling/cpal"]
# the engine code without an output backend (compile checks on machines without ALSA headers)
audio_engine = ["dep:bevy_seedling"]

[dependencies]
kk-mechanics = { path = "../kk_mechanics" }
rand = "0.8"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
half = "2"
bevy_seedling = { version = "0.8", optional = true, default-features = false, features = ["wav", "ogg", "rand", "hrtf", "effects"] }
bevy_render = { version = "0.19.1", default-features = false, optional = true }

[dependencies.bevy]
version = "0.19.1"
default-features = false
features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_animation",
    "bevy_asset",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_anti_alias",
    "bevy_post_process",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_gltf",
    "gltf_animation",
    "bevy_log",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_world_serialization",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "hdr",
    "png",
    "ktx2",
    "zstd_rust",
    "bluenoise_texture",
    "smaa_luts",
    "tonemapping_luts",
    "x11",
    # Bevy 0.19 registers reflected types (glTF scene components) through auto-registration
    "reflect_auto_register",
]
